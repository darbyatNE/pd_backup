name: Deploy

# Runs on every push to main. Deploys the backend container to ECS and the
# frontend bundle to S3 + CloudFront. See AWS-RESOURCES.md §13 for the IAM
# OIDC setup this workflow assumes.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  backend:
    name: Backend — build and deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        env:
          IMAGE: ${{ vars.ECR_BACKEND_REPO }}:${{ github.sha }}
          LATEST: ${{ vars.ECR_BACKEND_REPO }}:latest
        run: |
          docker build \
            -t "$IMAGE" \
            -t "$LATEST" \
            -f backend/Dockerfile \
            backend
          docker push "$IMAGE"
          docker push "$LATEST"

      # Enforce the RDS wiring on every deploy: ensure the RDS security group
      # allows the backend SG, register a task-def revision that carries the DB
      # secrets block (referencing Secrets Manager) with the freshly-pushed
      # image pinned, then roll the service. The DB password is NOT handled here
      # — it lives once in Secrets Manager (created via the one-time setup:
      # `./infra/wire-rds-to-ecs.sh --setup --apply`). See infra/wire-rds-to-ecs.sh.
      - name: Wire RDS + roll ECS service
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
          ECS_BACKEND_SERVICE: ${{ vars.ECS_BACKEND_SERVICE }}
          IMAGE: ${{ vars.ECR_BACKEND_REPO }}:${{ github.sha }}
          SKIP_SECRET: "1"   # secret value managed once in Secrets Manager
          SKIP_IAM: "1"      # execution-role policy granted once during setup
          SKIP_SG: "1"       # RDS ingress rule set once during setup (no drift)
        run: ./infra/wire-rds-to-ecs.sh --apply

  frontend:
    name: Frontend — build and deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-save

      - name: Build
        working-directory: frontend
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: npm run build

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Sync build output to S3
        run: |
          aws s3 sync frontend/dist/ "s3://${{ vars.FRONTEND_BUCKET }}/" \
            --delete --no-progress

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DIST_ID }}" \
            --paths '/*' \
            --no-cli-pager
